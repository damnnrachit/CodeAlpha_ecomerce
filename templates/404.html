{% extends 'base.html' %}

{% block title %}Page Not Found | SwiftShop{% endblock %}

{% block content %}
<div class="empty-state my-5 py-5">
    <i class="bi bi-exclamation-octagon text-danger display-1 d-block mb-3"></i>
    <h1 class="fw-bold">404 - Page Not Found</h1>
    <p class="text-muted mb-4 fs-5">Sorry, the product or page you are looking for does not exist or may have been moved.</p>
    <a href="{% url 'store:product_list' %}" class="btn btn-primary btn-lg px-4">
        <i class="bi bi-house-door me-1"></i> Return to Catalog
    </a>
</div>
{% endblock %}
